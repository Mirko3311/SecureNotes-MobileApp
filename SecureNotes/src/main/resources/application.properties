spring.application.name=SecureNotes

spring.datasource.url=jdbc:mysql://localhost:3306/secure_notes?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

security.jwt.issuer=secure-notes-api
security.jwt.secret=${JWT_SECRET_BASE64}
security.totp.issuer=SecureNotes
security.jwt.access-token-ttl-seconds=3600
security.totp.encryption-key=${TOTP_ENCRYPTION_KEY_BASE64}